<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Pong Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #wrap {
    position: relative;
    display: inline-block;
  }
  canvas {
    display: block;
    background: #0a0e27;
    border: 4px solid #14162b;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    max-width: 95vw;
    max-height: 90vh;
  }
  #muteBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 16px;
    cursor: pointer;
    z-index: 5;
  }
  #hint {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
  <button id="muteBtn" title="Toggle music">🔊</button>
  <div id="hint">SPACE / Tap to flap &nbsp;•&nbsp; SPACE to restart</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Audio (all synthesized, no external files needed) ----------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const actx = new AudioCtx();
  let muted = false;

  function tone(freq, start, dur, type = 'sine', vol = 0.2) {
    if (muted) return;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime + start);
    gain.gain.setValueAtTime(vol, actx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + start + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(actx.currentTime + start);
    osc.stop(actx.currentTime + start + dur);
  }

  function flapSound() { tone(500, 0, 0.08, 'square', 0.12); }

  // cha-ching cash register sound when passing a pillar
  function chaChing() {
    if (muted) return;
    tone(1500, 0, 0.09, 'square', 0.15);
    tone(1900, 0.06, 0.12, 'square', 0.15);
    tone(2400, 0.12, 0.18, 'triangle', 0.12);
  }

  function hitSound() { tone(120, 0, 0.3, 'sawtooth', 0.2); }
  function levelUpSound() {
    tone(660, 0, 0.1, 'square', 0.15);
    tone(880, 0.1, 0.1, 'square', 0.15);
    tone(1100, 0.2, 0.15, 'square', 0.15);
  }

  // Simple looping background chiptune melody (minor key, fits the darker theme)
  const melody = [440, 494, 523, 494, 440, 523, 587, 523, 440, 494, 523, 440];
  let musicTimer = null;
  let musicIndex = 0;
  function startMusic() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (!muted) tone(melody[musicIndex % melody.length], 0, 0.22, 'triangle', 0.045);
      musicIndex++;
    }, 260);
  }
  function stopMusic() {
    clearInterval(musicTimer);
    musicTimer = null;
    musicIndex = 0;
  }

  document.getElementById('muteBtn').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  });

  function unlockAudio() {
    if (actx.state === 'suspended') actx.resume();
  }

  // ---------- Game State ----------
  const GROUND_H = 80;
  const HIGH_SCORE_KEY = 'pingPongBirdHighScore';

  let state = 'start'; // start | playing | gameover
  let score = 0;
  let level = 1;
  let highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10);

  const bird = {
    x: 90,
    y: H / 2,
    r: 16,
    vy: 0,
    rotation: 0,
    wingPhase: 0
  };

  const GRAVITY_BASE = 0.45;
  const FLAP_VY = -8;
  let gravity = GRAVITY_BASE;

  let pipes = [];
  let obstacles = []; // extra floating spinner obstacles
  let trail = []; // motion trail particles behind the bird
  let pipeTimer = 0;
  let frame = 0;

  // stars for the night sky (fixed positions, twinkle by frame)
  const stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (H - GROUND_H - 40),
      r: Math.random() * 1.6 + 0.4,
      phase: Math.random() * Math.PI * 2
    });
  }
  // distant skyline silhouette
  const skyline = [];
  for (let i = 0; i < 14; i++) {
    skyline.push({
      x: i * 40,
      h: 30 + Math.random() * 70
    });
  }

  // Difficulty scales with level
  function getSettings() {
    const lvl = Math.min(level, 10); // cap extreme difficulty
    return {
      pipeSpeed: 2.6 + lvl * 0.35,
      gap: Math.max(150, 210 - lvl * 7),
      pipeInterval: Math.max(75, 110 - lvl * 4)
    };
  }

  function resetGame() {
    score = 0;
    level = 1;
    bird.y = H / 2;
    bird.vy = 0;
    bird.rotation = 0;
    pipes = [];
    obstacles = [];
    trail = [];
    pipeTimer = 0;
    frame = 0;
    gravity = GRAVITY_BASE;
  }

  function flap() {
    unlockAudio();
    if (state === 'start') {
      state = 'playing';
      startMusic();
    }
    if (state === 'playing') {
      bird.vy = FLAP_VY;
      flapSound();
    } else if (state === 'gameover') {
      resetGame();
      state = 'playing';
      startMusic();
    }
  }

  function spawnPipe() {
    const { gap } = getSettings();
    const minTop = 60;
    const maxTop = H - GROUND_H - gap - 60;
    const topH = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
    pipes.push({
      x: W + 20,
      topH: topH,
      botY: topH + gap,
      passed: false,
      w: 56
    });

    // From level 2 onward, sometimes add a bonus obstacle further out
    // (spinning paddle) positioned away from the very next gap so it's fair.
    if (level >= 2 && Math.random() < 0.45) {
      obstacles.push({
        x: W + 20 + 140,
        baseY: 100 + Math.random() * (H - GROUND_H - 200),
        amp: 40 + Math.random() * 40,
        speed: 0.02 + Math.random() * 0.02,
        phase: Math.random() * Math.PI * 2,
        r: 14,
        passed: false
      });
    }
  }

  function update() {
    if (state !== 'playing') return;
    frame++;

    const settings = getSettings();

    // bird physics
    bird.vy += gravity;
    bird.y += bird.vy;
    // classic flappy-bird style tilt: nose up on flap, dives nose-down when falling
    const targetRot = bird.vy < 0 ? -0.45 : Math.min(1.3, bird.vy / 8);
    bird.rotation += (targetRot - bird.rotation) * 0.25;
    bird.wingPhase += 0.35;

    // forward motion trail
    if (frame % 3 === 0) {
      trail.push({ x: bird.x - bird.r, y: bird.y, life: 1 });
    }
    for (let i = trail.length - 1; i >= 0; i--) {
      trail[i].x -= settings.pipeSpeed * 0.6;
      trail[i].life -= 0.05;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    // ground / ceiling collision
    if (bird.y + bird.r > H - GROUND_H) {
      bird.y = H - GROUND_H - bird.r;
      endGame();
    }
    if (bird.y - bird.r < 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }

    // pipes
    pipeTimer++;
    if (pipeTimer >= settings.pipeInterval) {
      pipeTimer = 0;
      spawnPipe();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= settings.pipeSpeed;

      // collision check
      const birdLeft = bird.x - bird.r;
      const birdRight = bird.x + bird.r;
      const birdTop = bird.y - bird.r;
      const birdBottom = bird.y + bird.r;

      if (birdRight > p.x && birdLeft < p.x + p.w) {
        if (birdTop < p.topH || birdBottom > p.botY) {
          endGame();
        }
      }

      // scoring
      if (!p.passed && p.x + p.w < bird.x - bird.r) {
        p.passed = true;
        score++;
        chaChing();
        const newLevel = Math.floor(score / 5) + 1;
        if (newLevel !== level) {
          level = newLevel;
          levelUpSound();
        }
      }

      if (p.x + p.w < -20) pipes.splice(i, 1);
    }

    // spinning paddle obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= settings.pipeSpeed;
      const oy = o.baseY + Math.sin(frame * o.speed + o.phase) * o.amp;

      const dx = bird.x - o.x;
      const dy = bird.y - oy;
      if (Math.sqrt(dx * dx + dy * dy) < bird.r + o.r - 4) {
        endGame();
      }

      if (o.x < -30) obstacles.splice(i, 1);
    }
  }

  function endGame() {
    if (state !== 'playing') return;
    state = 'gameover';
    hitSound();
    stopMusic();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
    }
  }

  // ---------- Drawing ----------
  function drawBackground() {
    // dark night sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05061a');
    g.addColorStop(0.5, '#0a0e27');
    g.addColorStop(1, '#161233');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.03 + s.phase);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + tw * 0.6) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // moon
    ctx.fillStyle = '#eef0d8';
    ctx.beginPath();
    ctx.arc(W - 60, 70, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(180,180,150,0.4)';
    ctx.beginPath(); ctx.arc(W - 68, 62, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W - 52, 78, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W - 70, 80, 4, 0, Math.PI * 2); ctx.fill();

    // distant skyline silhouette (slow parallax)
    ctx.fillStyle = 'rgba(15,15,35,0.85)';
    const scrollA = (frame * 0.4) % 40;
    ctx.beginPath();
    ctx.moveTo(-40, H - GROUND_H);
    for (let i = -1; i < skyline.length; i++) {
      const b = skyline[(i + skyline.length) % skyline.length];
      const x = i * 40 - scrollA;
      ctx.lineTo(x, H - GROUND_H - b.h);
      ctx.lineTo(x + 40, H - GROUND_H - b.h);
    }
    ctx.lineTo(W + 40, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }

  function drawTrail() {
    for (const t of trail) {
      ctx.fillStyle = 'rgba(255,255,255,' + (t.life * 0.35) + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, bird.r * 0.5 * t.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    // dark court-style ground
    ctx.fillStyle = '#1b1024';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#241734';
    ctx.fillRect(0, H - GROUND_H, W, 10);

    // dashed center-line texture like a table edge, glowing faintly
    ctx.fillStyle = 'rgba(230,57,70,0.55)';
    const offset = (frame * (state === 'playing' ? getSettings().pipeSpeed : 0)) % 28;
    for (let x = -28 + offset; x < W; x += 28) {
      ctx.fillRect(x, H - GROUND_H + 20, 14, 4);
    }
  }

  function drawPipes() {
    for (const p of pipes) {
      // top pillar (paddle-striped)
      drawPillar(p.x, 0, p.w, p.topH, true);
      // bottom pillar
      drawPillar(p.x, p.botY, p.w, H - GROUND_H - p.botY, false);
    }
  }

  function drawPillar(x, y, w, h, isTop) {
    const capH = 22;
    // dark wood body
    ctx.fillStyle = '#5a2a12';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#3d1c0c';
    ctx.fillRect(x, y, w * 0.35, h);

    // wood grain highlight
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(x + w - 10, y, 5, h);

    // rubber cap (glows red like a paddle edge, visible against dark bg)
    ctx.fillStyle = '#b5202c';
    if (isTop) {
      ctx.fillRect(x - 4, y + h - capH, w + 8, capH);
    } else {
      ctx.fillRect(x - 4, y, w + 8, capH);
    }
    // faint glow rim
    ctx.strokeStyle = 'rgba(255,80,90,0.5)';
    ctx.lineWidth = 2;
    if (isTop) {
      ctx.strokeRect(x - 4, y + h - capH, w + 8, capH);
    } else {
      ctx.strokeRect(x - 4, y, w + 8, capH);
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const oy = o.baseY + Math.sin(frame * o.speed + o.phase) * o.amp;
      ctx.save();
      ctx.translate(o.x, oy);
      ctx.rotate(frame * 0.06);
      // spinning mini paddle - black rubber with red center, glowing outline
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c0202c';
      ctx.beginPath();
      ctx.arc(0, 0, o.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // body - white ping pong ball with red stripe (the "ping pong bird")
    ctx.fillStyle = '#f4f4f4';
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // red stripe
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.ellipse(0, 2, bird.r, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // flapping wing (animated) - trails behind on the left (back of the bird)
    const wingLift = Math.sin(bird.wingPhase) * 6;
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.ellipse(-6, 3 + wingLift * 0.2, 8, 5 + Math.abs(wingLift) * 0.3, Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();

    // eye (forward-facing, on the leading/right side)
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(6, -4, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 0.8, 0, Math.PI * 2);
    ctx.fill();

    // beak (points forward/right, the direction of flight)
    ctx.fillStyle = '#f4a300';
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, -2);
    ctx.lineTo(bird.r + 10, 1);
    ctx.lineTo(bird.r - 2, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 3;
    ctx.font = 'bold 36px "Trebuchet MS", Arial';
    if (state === 'playing') {
      ctx.strokeText(score, W / 2, 60);
      ctx.fillText(score, W / 2, 60);

      ctx.font = 'bold 14px "Trebuchet MS", Arial';
      ctx.strokeText('Level ' + level, W / 2, 84);
      ctx.fillText('Level ' + level, W / 2, 84);
    }
  }

  function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 4;
    ctx.font = 'bold 34px "Trebuchet MS", Arial';
    ctx.strokeText('🏓 PING PONG BIRD', W / 2, H / 2 - 90);
    ctx.fillText('🏓 PING PONG BIRD', W / 2, H / 2 - 90);

    ctx.font = '18px "Trebuchet MS", Arial';
    ctx.lineWidth = 2;
    ctx.strokeText('Press SPACE or Tap to Start', W / 2, H / 2 - 30);
    ctx.fillText('Press SPACE or Tap to Start', W / 2, H / 2 - 30);

    ctx.font = 'bold 16px "Trebuchet MS", Arial';
    ctx.strokeText('High Score: ' + highScore, W / 2, H / 2 + 10);
    ctx.fillText('High Score: ' + highScore, W / 2, H / 2 + 10);

    // preview bird
    ctx.save();
    ctx.translate(W / 2, H / 2 + 70);
    ctx.fillStyle = '#f4f4f4';
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.ellipse(0, 2, 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 4;
    ctx.font = 'bold 30px "Trebuchet MS", Arial';
    ctx.strokeText('GAME OVER', W / 2, H / 2 - 80);
    ctx.fillText('GAME OVER', W / 2, H / 2 - 80);

    ctx.font = 'bold 22px "Trebuchet MS", Arial';
    ctx.lineWidth = 3;
    ctx.strokeText('Score: ' + score, W / 2, H / 2 - 30);
    ctx.fillText('Score: ' + score, W / 2, H / 2 - 30);

    const isNewHigh = score >= highScore && score > 0;
    ctx.font = 'bold 18px "Trebuchet MS", Arial';
    ctx.fillStyle = isNewHigh ? '#ffd700' : '#fff';
    ctx.strokeText((isNewHigh ? '🏆 NEW HIGH SCORE: ' : 'High Score: ') + highScore, W / 2, H / 2 + 5);
    ctx.fillText((isNewHigh ? '🏆 NEW HIGH SCORE: ' : 'High Score: ') + highScore, W / 2, H / 2 + 5);

    ctx.fillStyle = '#fff';
    ctx.font = '16px "Trebuchet MS", Arial';
    ctx.lineWidth = 2;
    ctx.strokeText('Level Reached: ' + level, W / 2, H / 2 + 35);
    ctx.fillText('Level Reached: ' + level, W / 2, H / 2 + 35);

    ctx.font = '16px "Trebuchet MS", Arial';
    ctx.strokeText('Press SPACE to Restart', W / 2, H / 2 + 75);
    ctx.fillText('Press SPACE to Restart', W / 2, H / 2 + 75);
  }

  function draw() {
    drawBackground();
    drawTrail();
    drawObstacles();
    drawPipes();
    drawGround();
    drawBird();
    drawHUD();

    if (state === 'start') drawStartScreen();
    if (state === 'gameover') drawGameOverScreen();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      flap();
    }
  });
  canvas.addEventListener('mousedown', flap);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    flap();
  }, { passive: false });

  loop();
})();
</script>
</body>
</html>
